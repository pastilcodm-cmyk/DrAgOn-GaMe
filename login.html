<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ورود - DrAgOn GaMe</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    background:
        radial-gradient(circle at top,#18283b 0%,#111722 45%,#090d13 100%);
    color:white;
    font-family:Arial,sans-serif;
}

nav{
    background:rgba(24,30,43,.97);
    padding:17px 8px;
    text-align:center;
    border-bottom:2px solid #00ff66;
    box-shadow:0 4px 25px rgba(0,255,102,.08);
    position:sticky;
    top:0;
    z-index:100;
    backdrop-filter:blur(10px);
}

nav a{
    color:#dce2eb;
    text-decoration:none;
    margin:5px 7px;
    font-size:14px;
    display:inline-block;
    transition:.25s;
}

nav a:hover{
    color:#00ff66;
}

.container{
    width:92%;
    max-width:500px;
    margin:40px auto 60px;
}

.title{
    text-align:center;
    font-size:30px;
    font-weight:bold;
    margin-bottom:10px;
}

.subtitle{
    text-align:center;
    color:#7f8a9d;
    font-size:13px;
    margin-bottom:25px;
}

.box{
    background:linear-gradient(
        145deg,
        rgba(27,35,50,.98),
        rgba(17,23,34,.98)
    );

    border:1px solid #293344;
    border-radius:20px;
    padding:25px;
    box-shadow:0 15px 40px rgba(0,0,0,.35);
}

label{
    display:block;
    color:#aab3c1;
    font-size:13px;
    margin-bottom:7px;
}

input{
    width:100%;
    padding:14px;
    margin-bottom:16px;
    border-radius:10px;
    border:1px solid #303b4e;
    background:#111722;
    color:white;
    outline:none;
    font-size:14px;
}

input:focus{
    border-color:#00ff66;
    box-shadow:0 0 10px rgba(0,255,102,.08);
}

.main-btn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:11px;
    background:#00ff66;
    color:#06150b;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
    transition:.25s;
}

.main-btn:hover{
    background:#00d957;
    transform:translateY(-2px);
}

.message{
    display:none;
    margin-top:15px;
    padding:12px;
    border-radius:9px;
    text-align:center;
    background:rgba(0,255,102,.07);
    color:#00ff66;
    font-size:13px;
}

.footer{
    text-align:center;
    color:#555f70;
    font-size:12px;
    margin-top:30px;
}

@media(max-width:600px){

    nav{
        padding:14px 5px;
    }

    nav a{
        font-size:13px;
        margin:4px 5px;
    }

    .container{
        width:94%;
        margin-top:25px;
    }

    .title{
        font-size:26px;
    }

    .box{
        padding:20px 16px;
    }

}

</style>

</head>

<body>

<nav>

<a href="index.html">خانه</a>

<a href="account.html" id="accountLink" style="display:none;">
اکانت من
</a>

<a href="players.html">بازیکنان آنلاین</a>

<a href="server.html">اتصال به سرور</a>

<a href="shop.html">فروشگاه</a>

<a href="login.html" id="loginLink">
ورود
</a>

</nav>


<div class="container">

<div class="title">
🐉 DrAgOn GaMe
</div>

<div class="subtitle">
ورود به حساب کاربری
</div>


<div class="box">

<label>
نام کاربری
</label>

<input
type="text"
id="loginUsername"
placeholder="نام کاربری">


<label>
ایمیل
</label>

<input
type="email"
id="loginEmail"
placeholder="example@gmail.com">


<label>
رمز عبور
</label>

<input
type="password"
id="loginPassword"
placeholder="رمز عبور">


<button
class="main-btn"
onclick="login()">

ورود به حساب

</button>


<div
id="message"
class="message">
</div>

</div>


<div class="footer">

🐉 DrAgOn GaMe © تمامی حقوق محفوظ است

</div>

</div>


<script>

function updateNavigation(){

    const loggedIn =
        localStorage.getItem("dragonGameLoggedIn") === "true";

    const accountLink =
        document.getElementById("accountLink");

    const loginLink =
        document.getElementById("loginLink");


    if(loggedIn){

        accountLink.style.display = "inline-block";

        loginLink.style.display = "none";

    }else{

        accountLink.style.display = "none";

        loginLink.style.display = "inline-block";

    }

}


function login(){

    const username =
        document.getElementById("loginUsername").value.trim();

    const email =
        document.getElementById("loginEmail").value.trim();

    const password =
        document.getElementById("loginPassword").value;

    const message =
        document.getElementById("message");


    if(!username || !email || !password){

        message.innerText =
            "لطفاً همه فیلدها را کامل کنید.";

        message.style.display = "block";

        return;
    }


    localStorage.setItem(
        "dragonGameLoggedIn",
        "true"
    );


    localStorage.setItem(
        "dragonGameUsername",
        username
    );


    localStorage.setItem(
        "dragonGameEmail",
        email
    );


    message.innerText =
        "ورود با موفقیت انجام شد.";

    message.style.display = "block";


    updateNavigation();


    setTimeout(function(){

        window.location.href = "account.html";

    },1000);

}


updateNavigation();

</script>

</body>

</html>
