<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ورود | DrAgOn GaMe</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Tahoma,Arial,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
      radial-gradient(circle at top,#0b6b3d 0%,#06351f 40%,#01150c 100%);
    color:white;
    padding:20px;
}

.container{
    width:100%;
    max-width:430px;
    background:rgba(2,31,18,.88);
    border:1px solid rgba(53,255,145,.35);
    border-radius:25px;
    padding:32px 28px;
    box-shadow:
      0 20px 60px rgba(0,0,0,.55),
      0 0 30px rgba(53,255,145,.08);
    backdrop-filter:blur(12px);
}

.logo{
    text-align:center;
    margin-bottom:25px;
}

.logo h1{
    color:#35ff91;
    font-size:34px;
    text-shadow:0 0 20px rgba(53,255,145,.6);
}

.logo p{
    color:#a9d9bd;
    margin-top:8px;
    font-size:14px;
}

.tabs{
    display:flex;
    gap:8px;
    background:#031d11;
    padding:5px;
    border-radius:13px;
    margin-bottom:25px;
}

.tab{
    flex:1;
    border:0;
    padding:12px;
    border-radius:9px;
    background:transparent;
    color:#9bb8a7;
    cursor:pointer;
    font-size:15px;
    font-weight:bold;
}

.tab.active{
    background:#16b961;
    color:white;
    box-shadow:0 0 15px rgba(22,185,97,.35);
}

.form{
    display:none;
}

.form.active{
    display:block;
}

label{
    display:block;
    margin:14px 0 7px;
    color:#c9f5d9;
    font-size:14px;
}

input{
    width:100%;
    padding:14px;
    border-radius:12px;
    border:1px solid #235d40;
    background:#061f13;
    color:white;
    outline:none;
    font-size:15px;
    transition:.25s;
}

input:focus{
    border-color:#35ff91;
    box-shadow:0 0 12px rgba(53,255,145,.18);
}

.main-btn{
    width:100%;
    margin-top:22px;
    padding:14px;
    border:0;
    border-radius:12px;
    background:linear-gradient(135deg,#20e879,#078c45);
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    transition:.25s;
}

.main-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 0 22px rgba(53,255,145,.4);
}

.code-box{
    display:none;
    margin-top:20px;
    padding-top:18px;
    border-top:1px solid #174b31;
}

.message{
    margin-top:15px;
    text-align:center;
    color:#8dffbb;
    font-size:13px;
    min-height:18px;
}

.back{
    display:block;
    text-align:center;
    margin-top:18px;
    color:#75e8a5;
    text-decoration:none;
    font-size:13px;
}

.back:hover{
    color:#35ff91;
}

@media(max-width:480px){
    .container{
        padding:27px 20px;
    }

    .logo h1{
        font-size:29px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">
        <h1>🐉 DrAgOn GaMe</h1>
        <p>ورود به حساب کاربری</p>
    </div>

    <div class="tabs">
        <button class="tab active" onclick="showForm('login',this)">
            ورود
        </button>

        <button class="tab" onclick="showForm('register',this)">
            ثبت‌نام
        </button>
    </div>

    <!-- LOGIN -->

    <div id="login" class="form active">

        <label>نام کاربری</label>
        <input
            id="loginUsername"
            type="text"
            placeholder="نام کاربری"
        >

        <label>Gmail / ایمیل</label>
        <input
            id="loginEmail"
            type="email"
            placeholder="example@gmail.com"
        >

        <label>رمز عبور</label>
        <input
            id="loginPassword"
            type="password"
            placeholder="رمز عبور"
        >

        <button class="main-btn" onclick="login()">
            ورود به حساب
        </button>

        <div id="loginMessage" class="message"></div>

        <a href="#" class="back">
            فراموشی رمز عبور؟
        </a>

    </div>


    <!-- REGISTER -->

    <div id="register" class="form">

        <label>نام کاربری</label>
        <input
            id="registerUsername"
            type="text"
            placeholder="نام کاربری"
        >

        <label>Gmail / ایمیل</label>
        <input
            id="registerEmail"
            type="email"
            placeholder="example@gmail.com"
        >

        <label>رمز عبور</label>
        <input
            id="registerPassword"
            type="password"
            placeholder="رمز عبور"
        >

        <label>تکرار رمز عبور</label>
        <input
            id="registerPassword2"
            type="password"
            placeholder="تکرار رمز عبور"
        >

        <button class="main-btn" onclick="sendCode()">
            ارسال کد تأیید
        </button>

        <div id="codeBox" class="code-box">

            <label>کد تأیید ایمیل</label>

            <input
                id="emailCode"
                type="text"
                inputmode="numeric"
                maxlength="6"
                placeholder="کد ۶ رقمی"
            >

            <button class="main-btn" onclick="verifyCode()">
                تأیید و ساخت حساب
            </button>

        </div>

        <div id="registerMessage" class="message"></div>

    </div>

</div>


<script>

function showForm(formName, button){

    document.querySelectorAll(".form")
        .forEach(form => form.classList.remove("active"));

    document.getElementById(formName)
        .classList.add("active");

    document.querySelectorAll(".tab")
        .forEach(tab => tab.classList.remove("active"));

    button.classList.add("active");

    document.querySelector(".logo p").textContent =
        formName === "login"
        ? "ورود به حساب کاربری"
        : "ساخت حساب جدید";
}


function login(){

    const username =
        document.getElementById("loginUsername").value.trim();

    const email =
        document.getElementById("loginEmail").value.trim();

    const password =
        document.getElementById("loginPassword").value;

    const message =
        document.getElementById("loginMessage");

    if(!username || !email || !password){

        message.textContent =
            "لطفاً همه قسمت‌ها را پر کنید.";

        return;
    }

    message.textContent =
        "سیستم ورود واقعی هنوز به سرور متصل نشده است.";
}


function sendCode(){

    const username =
        document.getElementById("registerUsername").value.trim();

    const email =
        document.getElementById("registerEmail").value.trim();

    const password =
        document.getElementById("registerPassword").value;

    const password2 =
        document.getElementById("registerPassword2").value;

    const message =
        document.getElementById("registerMessage");

    if(!username || !email || !password || !password2){

        message.textContent =
            "لطفاً همه قسمت‌ها را پر کنید.";

        return;
    }

    if(password !== password2){

        message.textContent =
            "رمزهای عبور یکسان نیستند.";

        return;
    }

    document.getElementById("codeBox").style.display = "block";

    message.textContent =
        "صفحه آماده دریافت کد تأیید است.";
}


function verifyCode(){

    const code =
        document.getElementById("emailCode").value.trim();

    const message =
        document.getElementById("registerMessage");

    if(code.length !== 6){

        message.textContent =
            "کد تأیید باید ۶ رقمی باشد.";

        return;
    }

    message.textContent =
        "برای تأیید واقعی کد، این صفحه باید به سرور متصل شود.";
}

</script>

</body>
      </html>
