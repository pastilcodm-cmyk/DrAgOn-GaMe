<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ورود و ثبت‌نام - DrAgOn GaMe</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;

    background:
        radial-gradient(circle at top,#18283b 0%,#111722 45%,#090d13 100%);

    color:white;
    font-family:Arial,sans-serif;
}

/* NAV */

nav{
    background:rgba(24,30,43,.97);
    padding:17px 8px;
    text-align:center;

    border-bottom:2px solid #00ff66;

    box-shadow:0 4px 25px rgba(0,255,102,.08);

    position:sticky;
    top:0;
    z-index:100;

    backdrop-filter:blur(10px);
}

nav a{
    color:#dce2eb;
    text-decoration:none;

    margin:5px 7px;

    font-size:14px;

    display:inline-block;

    transition:.25s;
}

nav a:hover{
    color:#00ff66;
}

/* CONTAINER */

.container{
    width:92%;
    max-width:500px;

    margin:40px auto 60px;
}

/* TITLE */

.title{
    text-align:center;
    font-size:30px;
    font-weight:bold;

    margin-bottom:10px;
}

.subtitle{
    text-align:center;
    color:#7f8a9d;

    font-size:13px;

    margin-bottom:25px;
}

/* BOX */

.box{
    background:linear-gradient(
        145deg,
        rgba(27,35,50,.98),
        rgba(17,23,34,.98)
    );

    border:1px solid #293344;

    border-radius:20px;

    padding:25px;

    box-shadow:0 15px 40px rgba(0,0,0,.35);

    margin-bottom:18px;
}

/* TABS */

.tabs{
    display:flex;
    gap:10px;

    margin-bottom:22px;
}

.tab{
    flex:1;

    padding:13px;

    border:none;

    border-radius:10px;

    background:#202838;

    color:#9da7b7;

    font-size:14px;

    cursor:pointer;

    transition:.25s;
}

.tab.active{
    background:#00ff66;
    color:#06150b;
    font-weight:bold;
}

/* FORM */

.form{
    display:none;
}

.form.active{
    display:block;
}

label{
    display:block;

    color:#aab3c1;

    font-size:13px;

    margin-bottom:7px;
}

input{
    width:100%;

    padding:14px;

    margin-bottom:16px;

    border-radius:10px;

    border:1px solid #303b4e;

    background:#111722;

    color:white;

    outline:none;

    font-size:14px;
}

input:focus{
    border-color:#00ff66;

    box-shadow:0 0 10px rgba(0,255,102,.08);
}

/* BUTTON */

.main-btn{
    width:100%;

    padding:14px;

    border:none;

    border-radius:11px;

    background:#00ff66;

    color:#06150b;

    font-size:15px;

    font-weight:bold;

    cursor:pointer;

    transition:.25s;
}

.main-btn:hover{
    background:#00d957;

    transform:translateY(-2px);
}

/* MESSAGE */

.message{
    display:none;

    margin-top:15px;

    padding:12px;

    border-radius:9px;

    text-align:center;

    background:rgba(0,255,102,.07);

    color:#00ff66;

    font-size:13px;
}

/* FOOTER */

.footer{
    text-align:center;

    color:#555f70;

    font-size:12px;

    margin-top:30px;
}

/* MOBILE */

@media(max-width:600px){

    nav{
        padding:14px 5px;
    }

    nav a{
        font-size:13px;
        margin:4px 5px;
    }

    .container{
        width:94%;
        margin-top:25px;
    }

    .title{
        font-size:26px;
    }

    .box{
        padding:20px 16px;
    }

}

</style>

</head>


<body>


<!-- NAV -->

<nav>

<a href="index.html">خانه</a>
<a href="account.html">اکانت من</a>
<a href="players.html">بازیکنان آنلاین</a>
<a href="server.html">اتصال به سرور</a>
<a href="shop.html">فروشگاه</a>
<a href="login.html">ورود</a>
<a href="login.html">ثبت‌نام</a>

</nav>


<div class="container">


<div class="title">
🐉 DrAgOn GaMe
</div>

<div class="subtitle">
ورود یا ساخت حساب کاربری
</div>


<div class="box">


<!-- TABS -->

<div class="tabs">

<button
class="tab active"
onclick="showForm('login',this)">
ورود
</button>

<button
class="tab"
onclick="showForm('register',this)">
ثبت‌نام
</button>

</div>


<!-- LOGIN -->

<div
id="login"
class="form active">

<label>
نام کاربری
</label>

<input
type="text"
id="loginUsername"
placeholder="نام کاربری">


<label>
ایمیل
</label>

<input
type="email"
id="loginEmail"
placeholder="example@gmail.com">


<label>
رمز عبور
</label>

<input
type="password"
id="loginPassword"
placeholder="رمز عبور">


<button
class="main-btn"
onclick="login()">

ورود به حساب

</button>

</div>


<!-- REGISTER -->

<div
id="register"
class="form">

<label>
نام کاربری
</label>

<input
type="text"
id="registerUsername"
placeholder="نام کاربری">


<label>
ایمیل
</label>

<input
type="email"
id="registerEmail"
placeholder="example@gmail.com">


<label>
رمز عبور
</label>

<input
type="password"
id="registerPassword"
placeholder="رمز عبور">


<label>
تکرار رمز عبور
</label>

<input
type="password"
id="registerConfirm"
placeholder="تکرار رمز عبور">


<button
class="main-btn"
onclick="registerUser()">

ساخت حساب

</button>

</div>


<div
id="message"
class="message">
</div>


</div>


<div class="footer">

🐉 DrAgOn GaMe © تمامی حقوق محفوظ است

</div>


</div>


<script>

function showForm(formName,button){

    document.querySelectorAll(".form")
    .forEach(function(form){
        form.classList.remove("active");
    });

    document.querySelectorAll(".tab")
    .forEach(function(tab){
        tab.classList.remove("active");
    });

    document
    .getElementById(formName)
    .classList.add("active");

    button.classList.add("active");

    document
    .getElementById("message")
    .style.display="none";
}


function login(){

    const username =
        document.getElementById("loginUsername").value.trim();

    const email =
        document.getElementById("loginEmail").value.trim();

    const password =
        document.getElementById("loginPassword").value;

    const message =
        document.getElementById("message");


    if(!username || !email || !password){

        message.innerText =
            "لطفاً همه فیلدها را کامل کنید.";

        message.style.display="block";

        return;
    }


    message.innerText =
        "سیستم ورود واقعی هنوز به سرور متصل نشده است.";

    message.style.display="block";
}


function registerUser(){

    const username =
        document.getElementById("registerUsername").value.trim();

    const email =
        document.getElementById("registerEmail").value.trim();

    const password =
        document.getElementById("registerPassword").value;

    const confirm =
        document.getElementById("registerConfirm").value;

    const message =
        document.getElementById("message");


    if(!username || !email || !password || !confirm){

        message.innerText =
            "لطفاً همه فیلدها را کامل کنید.";

        message.style.display="block";

        return;
    }


    if(password !== confirm){

        message.innerText =
            "رمز عبور و تکرار آن یکسان نیست.";

        message.style.display="block";

        return;
    }


    message.innerText =
        "فرم ثبت‌نام آماده است؛ اتصال به سیستم حساب کاربری بعداً انجام می‌شود.";

    message.style.display="block";
}

</script>


</body>

  </html>
