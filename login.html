<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ورود | DrAgOn GaMe</title>

    <link rel="stylesheet" href="assets/style.css">

</head>

<body>

<nav class="main-nav">

    <a href="index.html">🏠 خانه</a>

    <a href="account.html"
       id="accountLink"
       style="display:none;">
        👤 اکانت من
    </a>

    <a href="players.html">
        👥 بازیکنان آنلاین
    </a>

    <a href="server.html">
        🎮 اتصال به سرور
    </a>

    <a href="shop.html">
        🛒 فروشگاه
    </a>

    <a href="login.html"
       id="loginLink">
        🔐 ورود
    </a>

</nav>


<main class="container">

    <section class="card"
             style="max-width:520px; margin:auto;">

        <div class="center">

            <h1 class="text-green">
                🔐 ورود به اکانت
            </h1>

            <p style="margin-top:10px;">
                ورود به حساب DrAgOn GaMe
            </p>

        </div>


        <form id="loginForm"
              class="form"
              style="margin-top:25px;">

            <input
                class="input"
                id="username"
                type="text"
                placeholder="نام کاربری"
                required
            >

            <input
                class="input"
                id="email"
                type="email"
                placeholder="ایمیل"
                required
            >

            <input
                class="input"
                id="password"
                type="password"
                placeholder="رمز عبور"
                required
            >

            <button
                class="btn btn-primary"
                type="submit">
                ورود
            </button>

        </form>


        <div id="loginMessage"
             class="center"
             style="margin-top:15px;">
        </div>

    </section>

</main>


<footer>
    © 2026 DrAgOn GaMe
</footer>


<script src="assets/app.js"></script>


<script>

document.getElementById("loginForm")
.addEventListener("submit", function(event) {

    event.preventDefault();

    const username =
        document.getElementById("username").value.trim();

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value.trim();

    const message =
        document.getElementById("loginMessage");


    if (!username || !email || !password) {

        message.innerHTML =
            '<span style="color:#ff6666;">لطفاً همه فیلدها را پر کنید.</span>';

        return;
    }


    localStorage.setItem(
        "dragonGameLoggedIn",
        "true"
    );

    localStorage.setItem(
        "dragonGameUsername",
        username
    );

    localStorage.setItem(
        "dragonGameEmail",
        email
    );


    message.innerHTML =
        '<span style="color:#00ff66;">ورود موفق بود! در حال انتقال...</span>';


    setTimeout(function() {

        window.location.href =
            "account.html";

    }, 700);

});

</script>

</body>
                </html>
